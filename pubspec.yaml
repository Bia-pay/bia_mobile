name: bia
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.1+4

environment:
  sdk: ^3.10.0-162.1.beta

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  media_store_plus: ^0.1.3
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.7
  flutter_native_splash: ^2.4.4
  mobile_scanner: ^7.1.4
  go_router_builder:
  camera: ^0.11.2
  permission_handler: ^12.0.1
  flutter_staggered_grid_view: ^0.7.0
  internet_connection_checker: ^3.0.1
  flutter_easyloading: ^3.0.5
  flutter_riverpod:
  hive: ^2.2.3
  local_auth_android: ^1.0.46  # Android-specific
  local_auth_darwin: ^1.4.2    # iOS/macOS
  flutter_secure_storage: ^9.2.2  # Secure credential storage
  crypto: ^3.0.6
  device_info_plus: ^10.1.0
  network_info_plus: ^4.1.0
  pin_code_fields: ^8.0.0
  hive_flutter: ^1.1.0
  flutter_screenutil: ^5.9.3
  loading_overlay: ^0.5.0
  loading_animation_widget: ^1.3.0
  flutter_sliding_toast: ^1.5.2
  app_tracking_transparency: ^2.0.6+1
  shared_preferences: ^2.5.3
  local_auth: ^2.3.0
  go_router: ^14.8.0
  intl: ^0.20.2
  flutter_launcher_icons: ^0.13.1
  share_plus:
  svg_flutter:
  webview_flutter: ^4.2.2
  http: ^1.6.0
  socket_io_client: ^2.0.3+1
  image_picker: ^1.2.0
  mime: ^1.0.4
  flutter_image_compress: ^2.1.0
  http_parser: ^4.0.2
  firebase_core: ^4.3.0
  firebase_messaging: ^16.1.0
  flutter_local_notifications: ^17.0.0
  path_provider: ^2.1.5
  flutter_animate: ^4.5.2
  google_fonts: ^7.0.2
  pinput: ^6.0.1
  shimmer: ^3.0.0
  speech_to_text: ^7.3.0
  audioplayers: ^6.6.0
  record: ^5.1.0
  path: ^1.8.3
  google_generative_ai: ^0.4.7
  flutter_native_contact_picker: ^0.0.11
  qr_flutter: ^4.1.0
  lottie: ^3.3.3
  screenshot: ^3.0.0
  gal: ^2.3.2
  confetti: ^0.8.0
  url_launcher: ^6.3.2
  firebase_auth: ^6.5.1
  upgrader: ^10.3.0
  in_app_update: ^4.2.5
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0



flutter_gen:
  output: lib/gen/
  line_length: 80
  assets:
    enabled: false
  fonts:
    enabled: true

flutter:

  uses-material-design: true


  assets:
    - assets/images/
    - assets/svg/


  fonts:
    - family: Outfit
      fonts:
        - asset: assets/font/Outfit-Bold.ttf
          weight: 700
        - asset: assets/font/Outfit-SemiBold.ttf
          weight: 600
          style: normal
        - asset: assets/font/Outfit-Medium.ttf
          weight: 500
          style: normal
        - asset: assets/font/Outfit-Regular.ttf
          weight: 400
          style: normal
        - asset: assets/font/Outfit-Light.ttf
          weight: 300
          style: normal
  

dependency_overrides:
  record_linux: ^1.3.0

flutter_native_splash:
  color: "#0C284E"
  image: assets/svg/logo.png
  android: true
  ios: true

